<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Hallo aus der Mini App</h1>
    <p id="status">Lade ...</p>

    <section id="geprueft" hidden>
      <dl>
        <dt>Name</dt><dd id="vorname"></dd>
        <dt>Benutzername</dt><dd id="username"></dd>
        <dt>Nutzer-ID</dt><dd id="nutzerid"></dd>
      </dl>
      <label for="text">Text für den Chat</label>
      <input id="text" maxlength="200" autocomplete="off" value="Hallo!">
      <button id="senden" type="button">In den Chat senden</button>
    </section>

    <section id="formular" hidden>
      <label for="formtext">Text für den Bot</label>
      <input id="formtext" maxlength="200" autocomplete="off" value="Hallo Bot!">
      <button id="datensenden" type="button">Mit sendData senden</button>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
